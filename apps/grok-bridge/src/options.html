<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grok Bridge Options</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: rgba(255,255,255,0.95);
      border-radius: 16px;
      padding: 32px;
      max-width: 440px;
      width: 100%;
    }
    h3 { text-align: center; margin-bottom: 8px; color: #4a5568; }
    p { text-align: center; margin-bottom: 20px; color: #718096; font-size: 14px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #4a5568; font-weight: 500; }
    select, input {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
    }
    #status { margin-top: 12px; text-align: center; color: #38a169; font-size: 14px; min-height: 20px; }
    .hint { font-size: 12px; color: #a0aec0; margin-top: -10px; margin-bottom: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h3>Grok Bridge</h3>
    <p>API key stored locally only.</p>
    <label for="model">Model</label>
    <select id="model">
      <option value="grok-code-fast">Grok Code Fast</option>
      <option value="grok-beta">Grok Beta</option>
    </select>
    <label for="apiKey">xAI API Key</label>
    <input type="password" id="apiKey" placeholder="xAI API key" />
    <label for="vocabExtensionId">Vocab Study extension ID (optional)</label>
    <input type="text" id="vocabExtensionId" placeholder="From chrome://extensions" />
    <p class="hint">Enables &quot;Save to Vocab Study&quot; in the popup. Run <code>npm run link-extensions</code> after setting IDs.</p>
    <button id="save">Save</button>
    <div id="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
