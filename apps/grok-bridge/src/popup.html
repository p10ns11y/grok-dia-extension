<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grok Bridge</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 16px;
    }
    .container {
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
      padding: 16px;
    }
    h3 { text-align: center; margin-bottom: 12px; color: #4a5568; font-size: 17px; }
    p { font-size: 13px; color: #718096; margin-bottom: 10px; }
    textarea {
      width: 100%;
      height: 72px;
      padding: 10px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
      margin-bottom: 10px;
    }
    textarea:focus { outline: none; border-color: #667eea; }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-secondary {
      background: #edf2f7;
      color: #4a5568;
    }
    .btn-primary.loading { opacity: 0.7; pointer-events: none; }
    #response {
      margin-top: 10px;
      padding: 10px;
      background: #f7fafc;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
    }
    .hint { font-size: 11px; color: #a0aec0; margin-top: 6px; }
    #save-vocab-row { display: none; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h3>Grok Bridge</h3>
    <p>Page excerpt is included automatically when you send.</p>
    <textarea id="prompt" placeholder="Ask about the page or your selection"></textarea>
    <button id="send" class="btn-primary">Send to Grok</button>
    <div id="save-vocab-row">
      <button id="save-vocab" class="btn-secondary">Save to Vocab Study</button>
      <p class="hint">Requires Vocab Study extension ID in options.</p>
    </div>
    <div id="response">Ready.</div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
