<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vocabulary Builder - Grok Dia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f7fafc;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #4a5568;
    }

    .vocab-list {
      list-style: none;
      padding: 0;
    }

    .word-item {
      padding: 10px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
    }

    .word-item:last-child {
      border-bottom: none;
    }

    button {
      padding: 8px 16px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Vocabulary Builder</h1>
    <div>
      <button class="btn-primary" id="refresh-vocab">Refresh Vocabulary</button>
      <input type="text" id="search" placeholder="Search words..." style="margin: 10px; padding: 5px; width: 200px;">
      <button class="btn-secondary" id="search-btn">Search</button>
      <button class="btn-secondary" id="toggle-view">Toggle Graph/List</button>
      <button class="btn-secondary" id="start-flashcards">Start Flashcards</button>
    </div>
    <div id="vocab-list-view">
      <ul class="vocab-list" id="vocab-list">
        <li>Loading...</li>
      </ul>
    </div>
    <div id="vocab-graph-view" style="display: none;">
      <svg id="vocab-graph" width="800" height="600"></svg>
    </div>
    <div id="flashcard-view" style="display: none;">
      <div id="flashcard">
        <div id="flashcard-word">Word</div>
        <button id="show-meaning">Show Meaning</button>
        <div id="flashcard-meaning" style="display: none;">Meaning</div>
        <button id="next-card">Next</button>
      </div>
    </div>
  </div>
  <script type="module" src="vocab.js"></script>
</body>
</html>
